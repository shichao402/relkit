# sim-hosts 发布链：produce → merge → stage → release --execute → verify → e2e
# 复刻 Dec release.yml 的 Operator 分工：产品流水线只生产/合并 ArtifactSet；
# 发布 transaction 由 Operator（RELKIT_UPLOAD_TOKEN + RELKIT_RELEASE_VIA_CI）执行。
# 四产品共用 workflow，product 矩阵展开；sim-s1 双平台、其余 windows。
#
# 多产品矩阵（2026-10-18 重构）：push 触发时 derive_release_targets.mjs 从 diff
# 推导全部待发布产品（0f54474 教训：tail-1 单产品推导会漏跑双产品提交中的
# 另一个），build/operator-publish/e2e 全部按 matrix.product 展开。
# yaml 只做编排，推导逻辑全部在 scripts/（PAC 铁律）。

name: Sim release

on:
  workflow_dispatch:
    inputs:
      product:
        description: "product to release"
        type: choice
        options:
          - sim-s1
          - sim-s2-manager
          - sim-s2-managed
          - sim-s3
        default: sim-s1
      channel:
        description: "RUP channel"
        type: choice
        options:
          - dev
          - stable
        default: dev
      version:
        description: "version to release (e.g. 0.1.0+2)"
        required: true
      baseline_version:
        description: "baseline (from) version for upgrade e2e; empty = previous CHANGELOG section"
        required: false
        default: ""
  push:
    branches:
      - sim-hosts
    paths:
      - "products/**"
      - "scripts/**"
      - ".github/workflows/sim-release.yml"

concurrency:
  group: sim-${{ github.event.inputs.product || 'push' }}-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELKIT_CANDIDATE_ROOT_FINGERPRINT: ${{ vars.RELKIT_CANDIDATE_ROOT_FINGERPRINT }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      releases: ${{ steps.meta.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Derive release plan
        id: meta
        shell: bash
        env:
          INPUT_PRODUCT: ${{ github.event.inputs.product }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_BASELINE: ${{ github.event.inputs.baseline_version }}
        run: |
          set -euo pipefail
          # 发布计划推导全部走项目脚本（多产品矩阵 + per-product 参数）。
          # push 无 CHANGELOG 变更 → exit 3 → matrix=[] → 下游全部 skip（不兜底重发）。
          if [ -n "$INPUT_PRODUCT" ]; then
            PLAN=$(node scripts/derive_release_targets.mjs --dispatch "$INPUT_PRODUCT" "$INPUT_VERSION" "$INPUT_CHANNEL" "$INPUT_BASELINE")
          else
            BEFORE="HEAD~1"
            AFTER="HEAD"
            if [ -n "$(git rev-list -n 1 "$BEFORE" 2>/dev/null)" ] && [ "$(git rev-parse "$BEFORE" 2>/dev/null)" != "0000000000000000000000000000000000000000" ]; then
              set +e
              PLAN=$(node scripts/derive_release_targets.mjs "$BEFORE" "$AFTER")
              RC=$?
              set -e
              if [ "$RC" -eq 3 ]; then
                echo "matrix=[]" >> "$GITHUB_OUTPUT"
                echo "releases={}" >> "$GITHUB_OUTPUT"
                echo "no CHANGELOG change; nothing to release"
                exit 0
              elif [ "$RC" -ne 0 ]; then
                exit "$RC"
              fi
            else
              # 首提交 / 无法取 HEAD~1：无历史可比，不发
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              echo "releases={}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "plan: $PLAN"
          # 提取走项目脚本（单一实现源，PAC 铁律）：VAR=$(cmd) 赋值形式在 set -e 下
          # 失败即红——run 39096462210 教训：echo "x=$(cmd)" 会吞掉命令替换失败码，
          # step 绿但输出未注册，下游矩阵静默缺席。
          MATRIX=$(printf '%s' "$PLAN" | node scripts/verify_plan_extract.mjs matrix)
          RELEASES_OUT=$(printf '%s' "$PLAN" | node scripts/verify_plan_extract.mjs releases)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "releases=$RELEASES_OUT" >> "$GITHUB_OUTPUT"

  build:
    name: ArtifactSet (${{ matrix.product }} / ${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 动态 product 维度（derive 输出）× 静态 target 维度；runner / host_target
        # 由 include 按 target 匹配补齐。教训（run 39096462210 / 39097384892）：
        # 对象列表挂在 target: 维度下是非法矩阵——维度值必须是标量，对象只属于
        # include；错误形态 = build job 创建失败（完全缺席、无失败注解、run 红），
        # 与数据无关（两次 run 分别带真实矩阵与空矩阵，缺席一致）。
        product: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        target:
          - windows-amd64
          - darwin-universal
        include:
          - target: windows-amd64
            runner: windows-latest
            host_target: windows-amd64
          - target: darwin-universal
            runner: macos-15
            host_target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Materialize release params
        shell: bash
        env:
          RELEASES: ${{ needs.prepare.outputs.releases }}
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          # 提取走项目脚本（单一实现源）：输出与 eval 消费格式完全一致；
          # 未知产品/坏 JSON 时脚本非零退出，set -e 下 step 红，fail-loud。
          eval "$(printf '%s' "$RELEASES" | node scripts/verify_plan_extract.mjs "$PRODUCT")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

      # 仅当产品需要当前平台时才构建（sim-s1 双平台，其余仅 windows）。
      # product × target 笛卡尔积中不合法的组合在此 skip。
      - name: Check target applicability
        id: applicable
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            sim-s1) ;;
            *)
              if [ "$MATRIX_TARGET" != "windows-amd64" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.applicable.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Dart
        if: steps.applicable.outputs.skip != 'true' && matrix.product == 'sim-s1'
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        if: steps.applicable.outputs.skip != 'true' && matrix.product == 'sim-s2-manager'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: steps.applicable.outputs.skip != 'true' && matrix.product == 'sim-s3'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Setup MSVC build tools
        if: steps.applicable.outputs.skip != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install signed Operator bundle (Unix)
        if: steps.applicable.outputs.skip != 'true' && runner.os != 'Windows'
        env:
          OPS_URL: ${{ runner.os == 'macOS' && vars.RELKIT_OPS_DARWIN_URL || vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ runner.os == 'macOS' && vars.RELKIT_OPS_DARWIN_SHA256 || vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_URL_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_URL_SIM_S3 }}
          BUNDLE_SHA256: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_SHA256_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_SHA256_SIM_S3 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          if [ "$RUNNER_OS" = macOS ]; then HASH="$(shasum -a 256 "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')"; else HASH="$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')"; fi
          test "$HASH" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          if [ "$RUNNER_OS" = macOS ]; then HASH="$(shasum -a 256 "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')"; else HASH="$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')"; fi
          test "$HASH" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          install_args=(
            bundle install
            --bundle "$RUNNER_TEMP/relkit-bundle"
            --project "products/${{ matrix.product }}/relkit.project.json"
            --project-root "$GITHUB_WORKSPACE/products/${{ matrix.product }}"
            --home "$RUNNER_TEMP/relkit-home"
            --target "${{ matrix.host_target }}"
          )
          if [ -n "${RELKIT_CANDIDATE_ROOT_FINGERPRINT:-}" ]; then
            install_args+=(--candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT")
          fi
          "$RUNNER_TEMP/relkit-ops" "${install_args[@]}"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - name: Produce ArtifactSet (Unix)
        if: steps.applicable.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_WINDOWS_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_WINDOWS_SHA256 }}
          BUNDLE_URL: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_URL_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_URL_SIM_S3 }}
          BUNDLE_SHA256: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_SHA256_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_SHA256_SIM_S3 }}
        run: |
          if (-not $env:OPS_URL -or -not $env:OPS_SHA256 -or
              -not $env:BUNDLE_URL -or -not $env:BUNDLE_SHA256) {
            throw "Relkit Operator bundle variables are not configured"
          }
          $ops = Join-Path $env:RUNNER_TEMP "relkit-ops.exe"
          $archive = Join-Path $env:RUNNER_TEMP "relkit-bundle.zip"
          $bundle = Join-Path $env:RUNNER_TEMP "relkit-bundle"
          Invoke-WebRequest -UseBasicParsing $env:OPS_URL -OutFile $ops
          if ((Get-FileHash $ops -Algorithm SHA256).Hash.ToLower() -ne $env:OPS_SHA256.ToLower()) {
            throw "relkit-ops digest mismatch"
          }
          Invoke-WebRequest -UseBasicParsing $env:BUNDLE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:BUNDLE_SHA256.ToLower()) {
            throw "Operator bundle digest mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $bundle -Force
          $relkitHome = Join-Path $env:RUNNER_TEMP "relkit-home"
          $installArgs = @(
            "bundle", "install",
            "--bundle", $bundle,
            "--project", "products/${{ matrix.product }}/relkit.project.json",
            "--project-root", "$env:GITHUB_WORKSPACE/products/${{ matrix.product }}",
            "--home", $relkitHome,
            "--target", "${{ matrix.host_target }}"
          )
          if ($env:RELKIT_CANDIDATE_ROOT_FINGERPRINT) {
            $installArgs += @("--candidate-root-fingerprint", $env:RELKIT_CANDIDATE_ROOT_FINGERPRINT)
          }
          & $ops @installArgs
          if ($LASTEXITCODE -ne 0) { throw "Operator bundle install failed" }
          "RELKIT_HOME=$relkitHome" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Produce ArtifactSet (Unix)
        if: steps.applicable.outputs.skip != 'true' && runner.os != 'Windows'
        working-directory: products/${{ matrix.product }}
        env:
          VERSION: ${{ env.VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
        run: |
          ./relkitw artifacts produce \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --target "${{ matrix.target }}" \
            --out-dir "dist/relkit-artifact-set/${{ matrix.target }}" \
            --out "dist/relkit-artifact-set/${{ matrix.target }}/artifact-set.json"

      - name: Produce ArtifactSet (Windows)
        if: steps.applicable.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        working-directory: products/${{ matrix.product }}
        env:
          VERSION: ${{ env.VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
        run: |
          .\relkitw.cmd artifacts produce `
            --version $env:VERSION `
            --channel $env:CHANNEL `
            --target "${{ matrix.target }}" `
            --out-dir "dist/relkit-artifact-set/${{ matrix.target }}" `
            --out "dist/relkit-artifact-set/${{ matrix.target }}/artifact-set.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: steps.applicable.outputs.skip != 'true'
        with:
          name: sim-artifact-set-${{ matrix.product }}-${{ matrix.target }}
          path: products/${{ matrix.product }}/dist/relkit-artifact-set/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  operator-publish:
    name: Operator publish and verify (${{ matrix.product }})
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize release params
        shell: bash
        env:
          RELEASES: ${{ needs.prepare.outputs.releases }}
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          # 提取走项目脚本（单一实现源）：输出与 eval 消费格式完全一致；
          # 未知产品/坏 JSON 时脚本非零退出，set -e 下 step 红，fail-loud。
          eval "$(printf '%s' "$RELEASES" | node scripts/verify_plan_extract.mjs "$PRODUCT")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

      - name: Install signed Operator bundle
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_URL_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_URL_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_URL_SIM_S3 }}
          BUNDLE_SHA256: ${{ matrix.product == 'sim-s1' && vars.RELKIT_BUNDLE_SHA256_SIM_S1 || matrix.product == 'sim-s2-manager' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGER || matrix.product == 'sim-s2-managed' && vars.RELKIT_BUNDLE_SHA256_SIM_S2_MANAGED || vars.RELKIT_BUNDLE_SHA256_SIM_S3 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          test "$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          test "$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          install_args=(
            bundle install
            --bundle "$RUNNER_TEMP/relkit-bundle"
            --project "products/${{ matrix.product }}/relkit.project.json"
            --project-root "$GITHUB_WORKSPACE/products/${{ matrix.product }}"
            --home "$RUNNER_TEMP/relkit-home"
            --target linux-amd64
          )
          if [ -n "${RELKIT_CANDIDATE_ROOT_FINGERPRINT:-}" ]; then
            install_args+=(--candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT")
          fi
          "$RUNNER_TEMP/relkit-ops" "${install_args[@]}"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: sim-artifact-set-${{ matrix.product }}-*
          path: artifacts
          merge-multiple: false

      - name: Merge ArtifactSets
        run: |
          set -euo pipefail
          ins=()
          for dir in "$GITHUB_WORKSPACE"/artifacts/sim-artifact-set-*; do
            ins+=("$dir/artifact-set.json")
          done
          if [ "${#ins[@]}" -eq 0 ]; then
            echo "no artifact sets downloaded" >&2
            exit 1
          fi
          out="$GITHUB_WORKSPACE/dist/relkit-artifact-set/merged/artifact-set.json"
          out_dir="$(dirname "$out")"
          pushd "products/${{ matrix.product }}"
          # 不要提前创建 merged/：relkit artifacts merge 要求输出目录尚不存在
          # （否则报 merge output directory already exists）。仅单输入直通需自建。
          # TODO(relkit): relkit artifacts merge 硬性要求 ≥2 输入（vnext.go:1083），
          # 单平台产品（sim-s2-*/sim-s3）只有 1 个 ArtifactSet，无合法 merge 路径。
          # 当前 cp 直通跳过了 merge 内部的 VerifyFiles / 重复路径校验，是权宜之计。
          # 建议 relkit 增加官方单输入支持（或 artifacts passthrough 子命令，保留校验），
          # 届时删除本分支，统一走 merge。
          if [ "${#ins[@]}" -eq 1 ]; then
            mkdir -p "$out_dir"
            src_dir="$(dirname "${ins[0]}")"
            cp "${ins[0]}" "$out"
            for f in "$src_dir"/*; do
              [ "$(basename "$f")" = "artifact-set.json" ] && continue
              cp "$f" "$out_dir/"
            done
            echo "single artifact set: pass-through copy (json + files)"
          else
            args=(--out "$out")
            for f in "${ins[@]}"; do
              args+=(--in "$f")
            done
            ./relkitw artifacts merge "${args[@]}"
          fi
          popd

      - name: Stage and execute release
        env:
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
          RELKIT_RELEASE_VIA_CI: "1"
          MANAGED_ROOT_PB64: ${{ vars.RELKIT_PRODUCT_ROOT_SIM_S2_MANAGED }}
        run: |
          set -euo pipefail
          test -n "$RELKIT_UPLOAD_TOKEN"
          product_roots=()
          if [ "${{ matrix.product }}" = sim-s2-managed ]; then
            # sim-s2-managed（updater-projection，Loom 同款）无订阅、Node blob 无 facade，
            # offline bundle 通道下 bootstrap 不物化其产品根。
            # TODO(relkit): offline bundle 只写 RuntimeProfiles（offlinebundle.Install），
            # 未订阅产品无 Product RUP Root 通道，verify released 必然报
            # "no Product RUP Root was provisioned"。显式 --product-root 仅为诊断手段，
            # 按 SKILL.md 不得作为唯一验收证据。
            # 建议 relkit 增加 manager 代管验收通道：由 manager 的双订阅 resolution
            # 覆盖 managed 的发布验收。届时删除本段。
            test -n "$MANAGED_ROOT_PB64" || { echo "RELKIT_PRODUCT_ROOT_SIM_S2_MANAGED var is empty" >&2; exit 1; }
            printf '%s' "$MANAGED_ROOT_PB64" | base64 -d > "$RUNNER_TEMP/sim-s2-managed-root.pb"
            product_roots+=(--product-root "$RUNNER_TEMP/sim-s2-managed-root.pb")
          fi
          pushd "products/${{ matrix.product }}"
          ./relkitw stage \
            --artifact-set "$GITHUB_WORKSPACE/dist/relkit-artifact-set/merged/artifact-set.json"
          ./relkitw release --version "$VERSION"
          # relkit-agent 的 release.verify_failed 是第一性原理门禁（发布必须被消费面验证），
          # 宿主 CI 一律不放行；这里同样不放行，失败即失败。
          ./relkitw release --version "$VERSION" --execute
          verified=0
          for delay in 0 2 5 10 20 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if ./relkitw verify released --version "$VERSION" --channel "$CHANNEL" "${product_roots[@]}"; then
              verified=1
              break
            fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "release was not consumer-visible after bounded verification" >&2
            exit 1
          fi
          popd

  e2e:
    name: e2e (${{ matrix.product }})
    needs: [prepare, operator-publish]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize release params
        shell: bash
        env:
          RELEASES: ${{ needs.prepare.outputs.releases }}
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          # 提取走项目脚本（单一实现源）：输出与 eval 消费格式完全一致；
          # 未知产品/坏 JSON 时脚本非零退出，set -e 下 step 红，fail-loud。
          eval "$(printf '%s' "$RELEASES" | node scripts/verify_plan_extract.mjs "$PRODUCT")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Dart
        if: matrix.product == 'sim-s1'
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        if: matrix.product == 'sim-s2-manager'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: matrix.product == 'sim-s3'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Install baseline from release
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          CDN: https://update-staging.firoyang.com/artifact
        run: |
          set -euo pipefail
          # baseline 版本：优先 CDN 上一版（真实升级路径）；无 baseline 时用本次版本。
          FROM_VER="$BASELINE"
          if [ -z "$FROM_VER" ] || [ "$FROM_VER" = "$VERSION" ]; then
            FROM_VER="$VERSION"
          fi
          # sim-s2-managed（install-only 验收）例外：e2e 断言对象是本次发布的制品本身，
          # driver 的 install-only 断言 expect 本次 VERSION，故拉 VERSION blob；升级语义
          # 由 manager e2e 的代管断言覆盖，baseline blob 对 managed 无验收意义。
          if [ "$PRODUCT" = sim-s2-managed ]; then
            FROM_VER="$VERSION"
          fi
          VER_ENC=$(printf '%s' "$FROM_VER" | sed 's/+/%2B/g')
          mkdir -p .e2e/"$PRODUCT"/install
          dl() { curl -fsSL "$CDN/$PRODUCT/$VER_ENC/$1" -o ".e2e/$PRODUCT/install/$2"; }
          if [ "$PRODUCT" = sim-s3 ]; then
            # sim-s3 组件套件：拉 sim-server payload zip 平铺解压（组件 + sidecar 落位）。
            dl "sim-server-windows-amd64-payload.zip" "sim-server-payload.zip"
            unzip -o -j ".e2e/$PRODUCT/install/sim-server-payload.zip" 'files/*' -d ".e2e/$PRODUCT/install/"
            rm ".e2e/$PRODUCT/install/sim-server-payload.zip"
          elif [ "$PRODUCT" = sim-s2-managed ]; then
            # managed 是 blob js（无 sidecar，更新由 manager 驱动；e2e 走 install-only 断言）。
            dl "sim-s2-managed-windows-amd64.js" "sim-s2-managed.js"
          else
            # s1 / manager：payload zip 布局为 files.pb + files/<主程序> +
            # files/relkit-updater*（实测 0.1.0+3）。-j 平铺后主程序名即产品标准名
            # （sim-s1.exe / sim-s2-manager.exe），sidecar 一并落位，无需改名。
            if [ "$PRODUCT" = sim-s1 ]; then STD="sim-s1.exe"; else STD="sim-s2-manager.exe"; fi
            dl "windows-payload.zip" "payload.zip"
            unzip -o -j ".e2e/$PRODUCT/install/payload.zip" 'files/*' -d ".e2e/$PRODUCT/install/"
            rm ".e2e/$PRODUCT/install/payload.zip"
            if [ ! -f ".e2e/$PRODUCT/install/$STD" ]; then
              echo "payload extract: $STD missing" >&2; ls -la ".e2e/$PRODUCT/install/" >&2; exit 1
            fi
            ls ".e2e/$PRODUCT/install/" | grep -q 'relkit-updater' || { echo "sidecar missing after extract" >&2; exit 1; }
          fi
          ls -la ".e2e/$PRODUCT/install/"

      - name: Run e2e driver
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BASELINE" ] && [ "$BASELINE" != "$VERSION" ]; then
            # 真实 from→to 升级路径: baseline = CDN 上的上一版制品。
            node scripts/e2e_driver.mjs \
              --product "$PRODUCT" \
              --from "$BASELINE" \
              --expect "$VERSION" \
              --channel "$CHANNEL" \
              --rounds 3
          else
            # 无 baseline（首版）: 自装自验 up-to-date 终态（managed 走 install-only 断言）。
            node scripts/e2e_driver.mjs \
              --product "$PRODUCT" \
              --from "$VERSION" \
              --expect "$VERSION" \
              --channel "$CHANNEL" \
              --rounds 2
          fi
