name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/ts/package-lock.json
      - name: Test
        run: |
          go test ./...
          cargo test --manifest-path sdk/rust/Cargo.toml
          python -m unittest scripts/deploy/test_relkit.py scripts/test_relkit_consume.py scripts/test_relkit_host.py
          npm --prefix bindings/ts ci
          npm --prefix bindings/ts test
      - name: Build immutable release artifacts
        run: |
          python scripts/deploy/relkit.py version --check-tag "${GITHUB_REF_NAME}"
          python scripts/deploy/relkit.py build --all --out dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish Dec provides
        uses: shichao402/Dec/.github/actions/publish-provides@32c2705f859266e7ddacf5ea435d3e26e691ccf0
        with:
          project-root: ${{ github.workspace }}
          ref: ${{ github.ref_name }}
          registry-ssh-key: ${{ secrets.DEC_REGISTRY_SSH_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
