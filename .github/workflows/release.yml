name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          go test ./...
          cargo test --manifest-path sdk/rust/Cargo.toml
          python -m unittest deploy/test_relkit.py scripts/test_relkit_consume.py scripts/test_relkit_host.py
      - name: Build immutable release artifacts
        run: >-
          python deploy/relkit.py build
          --serve --agent --cli --updater --dart-sdk --rust-sdk
          --version "${GITHUB_REF_NAME#v}" --out dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
