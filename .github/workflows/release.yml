name: Release artifacts

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bindings/ts/package-lock.json
            cmd/relkit-console/web/package-lock.json
      - name: Test
        shell: bash
        run: |
          go test ./...
          cargo test --manifest-path sdk/rust/Cargo.toml
          python -m unittest scripts/deploy/test_relkit.py
          npm --prefix bindings/ts ci
          npm --prefix bindings/ts test
          npm --prefix cmd/relkit-console/web ci
          npm --prefix cmd/relkit-console/web test
  universal:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build thin Darwin binaries
        run: >-
          go run ./cmd/relkit build
          --cli --updater --ops
          --os darwin
          --out dist-thin
      - name: Build universal Darwin binaries
        run: |
          mkdir -p dist-universal
          lipo -create \
            dist-thin/relkit-darwin-amd64 \
            dist-thin/relkit-darwin-arm64 \
            -output dist-universal/relkit-darwin-universal
          lipo -create \
            dist-thin/relkit-updater-darwin-amd64 \
            dist-thin/relkit-updater-darwin-arm64 \
            -output dist-universal/relkit-updater-darwin-universal
          lipo -create \
            dist-thin/relkit-ops-darwin-amd64 \
            dist-thin/relkit-ops-darwin-arm64 \
            -output dist-universal/relkit-ops-darwin-universal
          for binary in dist-universal/*; do
            lipo -archs "$binary"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: relkit-darwin-universal
          path: dist-universal/*
          if-no-files-found: error
          retention-days: 1
  release:
    if: github.event_name == 'push'
    needs: [test, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/relkit-console/web/package-lock.json
      # dist/ is committed so a Go-only checkout builds; rebuilding here and
      # comparing is what keeps the committed bytes honest. A stale bundle
      # would ship code that is not in this commit, which is worse than a
      # build that needs Node.
      - name: Rebuild the console front end
        run: |
          npm --prefix cmd/relkit-console/web ci
          npm --prefix cmd/relkit-console/web run build
          if ! git diff --quiet -- cmd/relkit-console/internal/webui/dist; then
            echo "::error::cmd/relkit-console/internal/webui/dist is stale; run npm --prefix cmd/relkit-console/web run build and commit it"
            git --no-pager diff --stat -- cmd/relkit-console/internal/webui/dist
            exit 1
          fi
      - name: Build immutable release artifacts
        run: |
          go run ./cmd/relkit build --all --check-tag "${GITHUB_REF_NAME}" --out dist
      - uses: actions/download-artifact@v4
        with:
          name: relkit-darwin-universal
          path: dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
