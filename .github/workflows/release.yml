name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/ts/package-lock.json
      - name: Test
        run: |
          go test ./...
          cargo test --manifest-path sdk/rust/Cargo.toml
          python -m unittest scripts/deploy/test_relkit.py scripts/test_relkit_consume.py scripts/test_relkit_host.py
          npm --prefix bindings/ts ci
          npm --prefix bindings/ts test
      - name: Build immutable release artifacts
        run: |
          python scripts/deploy/relkit.py version --check-tag "${GITHUB_REF_NAME}"
          python scripts/deploy/relkit.py build --all --out dist
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish Dec provides
        env:
          DEC_REGISTRY_TOKEN: ${{ secrets.DEC_REGISTRY_TOKEN }}
          DEC_REGISTRY_SSH_KEY: ${{ secrets.DEC_REGISTRY_SSH_KEY }}
        run: |
          git clone --depth 1 https://github.com/shichao402/Dec.git /tmp/dec
          go build -C /tmp/dec -o /tmp/dec-registry ./cmd/dec-registry
          if [ -n "${DEC_REGISTRY_SSH_KEY:-}" ]; then
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "$DEC_REGISTRY_SSH_KEY" > "$HOME/.ssh/dec_registry"
            chmod 600 "$HOME/.ssh/dec_registry"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dec_registry -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            /tmp/dec-registry publish-provides --project-root "$GITHUB_WORKSPACE" --ref "$GITHUB_REF_NAME" --registry-url git@github.com:shichao402/Dec.git
          else
            /tmp/dec-registry publish-provides --project-root "$GITHUB_WORKSPACE" --ref "$GITHUB_REF_NAME"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
