name: rup_client
description: >-
  Thin Dart client for the relkit-updater sidecar: locate the binary, frame
  IPC messages and map events back to the host. Every protocol decision lives
  in the sidecar, not here.
version: 0.5.0
repository: https://github.com/shichao402/relkit/tree/main/sdk/dart
homepage: https://github.com/shichao402/relkit/tree/main/sdk/dart

environment:
  sdk: ^3.6.0

dependencies:
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
