[package]
name = "relkit-updater"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generated-protobuf facade for the relkit updater sidecar"
build = "build.rs"

[dependencies]
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.1"

[dev-dependencies]
tempfile = "3"
