[package]
name = "sim-s2-manager"
version = "0.1.0"
edition = "2021"
description = "relkit S2 manager simulated consumer (Rust facade, mirrors Loom-Launcher topology)"
build = "build.rs"

[[bin]]
name = "sim-s2-manager"
path = "src/main.rs"

[dependencies]
relkit-updater = { path = "../.relkit/components/sdk/rust" }
serde_json = "1"

[build-dependencies]
serde_json = "1"
