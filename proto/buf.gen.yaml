version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/shichao402/relkit/api
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../api
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/dart
    out: ../sdk/dart/lib/src/gen
