# Intranet publish + GET on one hostname (update.devcloud.woa.com).
# Agent stays on 127.0.0.1:8787; relkit-serve on 127.0.0.1:8080.
# This box is the HTTP origin on :80. WOA already terminates https://…:443 in
# front; add `listen 443 ssl` here only if you put a cert on the box itself.
# Also comment out the distro `listen 80` server in nginx.conf so this is the
# only :80 server.

server {
	listen 80 default_server;
	server_name update.devcloud.woa.com;
	client_max_body_size 8g;

	location /v1/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_request_buffering off;
	}

	location = /-/health {
		proxy_pass http://127.0.0.1:8787;
	}

	location / {
		# Full relkit-compatible data plane, analogous to an object-storage
		# endpoint. Anonymous GET/HEAD serves published objects. Mutations are
		# enforced by relkit-serve: ordinary PUT/COPY/DELETE need the operator
		# Bearer; CAS PUT needs the short-lived capability signature.
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
