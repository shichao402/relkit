# Intranet publish + GET on one :80/:443 name (update.devcloud.woa.com).
# Agent stays on 127.0.0.1:8787; relkit-serve on 127.0.0.1:8080.
# TLS: add listen 443 ssl + certificates when a cert exists; the cut is the same.

server {
	listen 80 default_server;
	server_name update.devcloud.woa.com;
	client_max_body_size 8g;

	location /v1/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_request_buffering off;
	}

	location = /-/health {
		proxy_pass http://127.0.0.1:8787;
	}

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
	}
}
