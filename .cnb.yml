# CNB 云原生构建：Release
# 文档：https://docs.cnb.cool/zh/build/grammar.html
# Release 附件：git:release 建 Release，再由 cnbcool/attachments 上传二进制
# main/PR 测试流水线已于 2026-09-28 移除：GitHub 为主仓（cnb.cool 为每日同步镜像），
# push CI 在镜像上约 24h 滞后且结果不可匿名判读；测试门禁由 GitHub release.yml 在 v* tag 时执行。
# 本文件仅保留 v* tag_push 发布构建面（CNB Release 附件，预编译 CLI 兜底通道，ADR 0017 决策 4）。

# tag_push 时 $CNB_BRANCH 为 tag 名（如 v0.2.0），不是分支名
"v*":
  tag_push:
    - name: release
      docker:
        image: golang:1.26
      stages:
        - name: build release artifacts
          script: |
            python3 scripts/deploy/relkit.py version --check-tag "${CNB_BRANCH}"
            python3 scripts/deploy/relkit.py build --store --agent --cli --updater --dart-sdk --out dist
        - name: verify linux serve binaries are static
          script: |
            set -eu
            apt-get update && apt-get install -y file
            for f in dist/relkit-store-linux-*; do
              if file "$f" | grep -q "dynamically linked"; then
                echo "$f is dynamically linked"; exit 1
              fi
              echo "$f: static"
            done
        - name: checksums
          script: cd dist && sha256sum * > SHA256SUMS
        - name: write release notes
          script: |
            cat > RELEASE_BODY.md <<'EOF'
            ## Binaries

            - `relkit-updater-*` — host sidecar (check/download/apply)
            - `relkit-*` — publisher CLI (`stage` / `publish` / …)
            - `relkit-agent-*` — CI publish agent
            - `relkit-store-*` — self-hosted RUP download + authenticated PUT
            - `relkit-sdk-dart.zip` — immutable Dart consumer SDK
            - `manifest.json` — commit, protocol window, SHA-256 of each binary

            Install the server on Linux with systemd:

            ```
            python3 scripts/deploy/relkit.py install serve --binary ./relkit-store-linux-amd64
            ```

            Product ops: copy `scripts/host/` and run `python scripts/host/relkit_host.py`.
            Empty-machine install: `python3 scripts/deploy/relkit.py install serve --binary ./relkit-store-linux-amd64`
            EOF
        - name: create CNB Release
          type: git:release
          options:
            latest: true
            descriptionFromFile: RELEASE_BODY.md
        - name: upload release attachments
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/*"
