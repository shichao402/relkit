{{define "setup"}}{{template "head" .}}
<div class="auth">
<header class="site">
<h1>Create operator</h1>
<p class="sub">This bootstrap works once. After this account exists it is spent.</p>
</header>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
<label for="bootstrap">Bootstrap token</label>
<input id="bootstrap" name="bootstrap" autocomplete="off" required autofocus>
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="password2">Confirm password</label>
<input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit">Create account</button>
</form>
</div>
{{template "foot" .}}{{end}}
