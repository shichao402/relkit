# update-internal.devcloud.woa.com: embedded-SDK protocol read plane (SSOT).
#
# Hosts fetch their toolchain from the URLs the signed tool manifest carries, and
# those URLs are built from the origin the publish used. That origin is this
# vhost, so it must serve the tool endpoints too: with only the protocol tree
# proxied here, the manifest signs URLs that answer 404 and every host fails at
# download time while publishing reports success.
#
# Tool reads are GET/HEAD only and stay write-blocked (the write plane is
# publish.devcloud.woa.com), so the read-only character of this vhost is
# unchanged.
server {
	listen 80;
	server_name update-internal.devcloud.woa.com;
	client_max_body_size 8g;

	# Toolchain distribution (requirements 12.1, 12.5, 12.6): the signed
	# manifest, the binaries, their sidecar signatures, the root public key and
	# the Catalog that names the current version.
	location /v1/tools/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		limit_except GET {
			deny all;
		}
	}

	location = /v1/catalog {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		limit_except GET {
			deny all;
		}
	}

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		# Read plane only: reject writes at the ingress.
		limit_except GET {
			deny all;
		}
	}
}
