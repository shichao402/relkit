# Public control plane + operations shell.
# Agent stays on 127.0.0.1:8787; relkit-store on 127.0.0.1:8080; the operator
# panel (relkit-console, ADR 0016) on 127.0.0.1:8081.
#
# relkit-store is currently an operations-plane shell on the public host.
# Its local tree is not the COS data plane. Anonymous GET + capability PUT +
# operator writes reach it via `location /`; publishing and CAS credentials
# continue to use relkit-agent.
#
# The public hostname is control+data, not the human catalog: the catalog
# lives on EdgeOne Makers, so `/` and `/browse` deliberately return 404.

server {
    listen 443 ssl;
    server_name publish.firoyang.com;
    client_max_body_size 8g;
    ssl_certificate /etc/letsencrypt/live/publish.firoyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publish.firoyang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    location = /-/health {
        proxy_pass http://127.0.0.1:8787;
    }

    location = /-/site {
        proxy_pass http://127.0.0.1:8787;
    }

    # Public hostname is control+data, not the human catalog (catalog lives on EdgeOne Makers).
    location = / {
        return 404;
    }
    location = /browse {
        return 404;
    }
    location ^~ /browse/ {
        return 404;
    }

    # Operator panel lives in relkit-console now (ADR 0016): /-/admin, /-/p/
    # and /-/latest/ are management-plane routes, not storage-plane GETs.
    location ^~ /-/admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /-/p/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /-/latest/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Data plane (relkit-compatible): anonymous GET + capability PUT + operator writes.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name publish.firoyang.com;
    return 301 https://$host$request_uri;
}
