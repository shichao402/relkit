# Public host ingress, matching the live publish.firoyang.com box.
# Three hostnames, same roles as the intranet sample (nginx-intranet.example.conf):
#
#   publish.firoyang.com          CI write plane (/v1/ -> agent) + operator panel
#                                 (/-/admin -> console) + everything else -> store
#   update-internal.firoyang.com  updater read plane (SSOT): GET/HEAD -> store only
#   update.firoyang.com           human browse page: GET -> store, which renders
#                                 it from the release tree (same as the intranet)
#
# Processes: relkit-agent 127.0.0.1:8787, relkit-store 127.0.0.1:8080,
# relkit-console 127.0.0.1:8081. The data plane is the store tree
# /srv/releases; there is no object storage behind it.
#
# TLS layout: port 443 belongs to an nginx `stream` block that routes by SNI
# (ssl_preread) and adds the PROXY protocol header. Every HTTPS vhost therefore
# listens on 127.0.0.1:4443 with `ssl proxy_protocol`; do not add `listen 443`
# to an http server, it would fight the stream block for the port. Real client
# addresses come back through set_real_ip_from (see the realip snippet).
#
# Certificates are issued by certbot with the webroot authenticator
# (/var/www/letsencrypt), so every :80 server keeps the ACME location.
# Topology reference: docs/design/topology.md.

# ---------------------------------------------------------------------------
# stream-sni.conf — included from the top level of nginx.conf (outside http {}).
# ---------------------------------------------------------------------------
#
# stream {
#     map $ssl_preread_server_name $sni_backend {
#         default 127.0.0.1:4443;
#     }
#     server {
#         listen 443;
#         listen [::]:443;
#         ssl_preread on;
#         proxy_protocol on;
#         proxy_pass $sni_backend;
#     }
# }

# ---------------------------------------------------------------------------
# conf.d/00-proxy-protocol-realip.conf — trust the address the stream hop adds.
# ---------------------------------------------------------------------------
set_real_ip_from 127.0.0.1;
real_ip_header proxy_protocol;

# ---------------------------------------------------------------------------
# publish.firoyang.com — CI write plane and operator panel.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name publish.firoyang.com;
    client_max_body_size 8g;
    ssl_certificate /etc/letsencrypt/live/publish.firoyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publish.firoyang.com/privkey.pem;

    # Agent: tools, catalog, runtime profile, CAS credentials, staged, publish,
    # unpublish, admin API. Tool URLs are signed with the agent's own publicURL
    # (https://publish.firoyang.com), so tools are only ever served here.
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    location = /-/health {
        proxy_pass http://127.0.0.1:8787;
    }

    location = /-/site {
        proxy_pass http://127.0.0.1:8787;
    }

    # Operator panel (relkit-console). Reads the release tree read-only; every
    # write goes to the agent's /v1/admin/*.
    location ^~ /-/admin {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /-/p/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /-/latest/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Store: CAS capability PUTs from CI and compatibility reads.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name publish.firoyang.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# update-internal.firoyang.com — updater read plane. Protocol tree only:
# no /v1/ (so no tools or catalog), no console, no browse page.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name update-internal.firoyang.com;
    ssl_certificate /etc/letsencrypt/live/update-internal.firoyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update-internal.firoyang.com/privkey.pem;

    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name update-internal.firoyang.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# update.firoyang.com — human browse page. relkit-serve renders the page at "/"
# from the catalog it already holds, so this hostname is the same shape as the
# intranet one: a GET-only reverse proxy onto the storage plane. Nothing here
# writes, and the page says so itself while the catalog is empty.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name update.firoyang.com;
    ssl_certificate /etc/letsencrypt/live/update.firoyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.firoyang.com/privkey.pem;

    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name update.firoyang.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
