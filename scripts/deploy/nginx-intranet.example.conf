# Intranet control plane + compatibility GET origin.
# Agent stays on 127.0.0.1:8787. relkit-store listens independently on :8080,
# and profiles use that host:8080 as both baseUrl and uploadUrl, analogous to a
# COS endpoint. nginx never carries publish bytes.
#
# The operator panel lives in relkit-console on 127.0.0.1:8081 (ADR 0016):
# /-/admin, /-/p/ and /-/latest/ are management-plane routes and never reach
# the storage plane.
#
# The read-only fallback below preserves old signed URLs that used the shared
# hostname. It may be removed after those releases are outside their support
# window. WOA already terminates https://…:443 in front; add `listen 443 ssl`
# here only if you put a cert on the box itself.
# Also comment out the distro `listen 80` server in nginx.conf so this is the
# only :80 server.

server {
	listen 80 default_server;
	server_name update.devcloud.woa.com;
	client_max_body_size 8g;

	location /v1/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_request_buffering off;
	}

	location = /-/health {
		proxy_pass http://127.0.0.1:8787;
	}

	# Operator panel lives in relkit-console now (ADR 0016): the split moved
	# /-/admin, /-/p/ and /-/latest/ off the storage plane onto their own unit.
	location ^~ /-/admin {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location ^~ /-/p/ {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location ^~ /-/latest/ {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		# Compatibility alias for old read URLs only. All current data-plane
		# operations use relkit-store's independent endpoint.
		limit_except GET {
			deny all;
		}
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
