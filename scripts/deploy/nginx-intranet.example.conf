# Intranet ingress, three vhosts, absolutely isomorphic with the public side
# (user decision 2026-10-19). Agent stays on 127.0.0.1:8787, relkit-store on
# 127.0.0.1:8080, relkit-console on 127.0.0.1:8081 (ADR 0016).
#
#   publish.devcloud.woa.com    CI write plane (/v1/) + legacy entryUrls read
#   update-internal.devcloud.woa.com  embedded-SDK protocol read plane (SSOT)
#   update.devcloud.woa.com     human browse page + legacy signed-URL read
#
# Hostnames are the only contract; which machine they point at is irrelevant.
# WOA terminates https://…:443 in front of the box; add `listen 443 ssl` here
# only if you put a cert on the box itself. Also comment out the distro
# `listen 80` server in nginx.conf so these are the only :80 servers.

# CI write plane. Mirrors nginx-public.example.conf (publish.firoyang.com).
server {
	listen 80;
	server_name publish.devcloud.woa.com;
	client_max_body_size 8g;

	location /v1/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_request_buffering off;
	}

	location = /-/health {
		proxy_pass http://127.0.0.1:8787;
	}

	location = /-/site {
		proxy_pass http://127.0.0.1:8787;
	}

	# Operator panel lives in relkit-console (ADR 0016): /-/admin, /-/p/ and
	# /-/latest/ are management-plane routes, never storage-plane GETs.
	location ^~ /-/admin {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location ^~ /-/p/ {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location ^~ /-/latest/ {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Data plane (relkit-compatible): anonymous GET + capability PUT + operator
	# writes. Same shape as the public publish vhost.
	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}

# Embedded-SDK protocol read plane (SSOT). Mirrors the public
# update-internal.firoyang.com vhost: protocol-tree GET/HEAD with Range
# passthrough, no /v1/, no console, no browse.
server {
	listen 80;
	server_name update-internal.devcloud.woa.com;
	client_max_body_size 8g;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;

		# Read plane only: reject writes at the ingress.
		limit_except GET {
			deny all;
		}
	}
}

# Legacy single-domain vhost: human browse page + read-only fallback for old
# signed URLs. The /v1/ write plane now lives on publish.devcloud.woa.com;
# keep the compatibility GET shape until legacy releases are outside their
# support window, then retire this vhost.
server {
	listen 80 default_server;
	server_name update.devcloud.woa.com;
	client_max_body_size 8g;

	location = /-/health {
		proxy_pass http://127.0.0.1:8787;
	}

	# Transitional: legacy clients and scripts still hit /v1/ on the old
	# hostname. Remove once CI and profiles are all on publish.*.
	location /v1/ {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_request_buffering off;
	}

	location / {
		# Compatibility alias for old read URLs only. All current data-plane
		# operations use update-internal (SDK reads) or publish (writes).
		limit_except GET {
			deny all;
		}
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Range $http_range;
		proxy_set_header If-Range $http_if_range;
		proxy_request_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
