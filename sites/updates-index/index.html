:root{color-scheme:light dark;--bg:#f6f5f1;--fg:#1c1917;--muted:#57534e}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}

<div class="wrap">
<h1>Releases</h1>
<p class="sub">This directory is the Makers site contract (static, no <code>edge-functions/</code>). <code>relkit publish</code> deploys <code>.relkit/browse</code> from the product repo when <code>site.makers</code> is set. Intranet <code>local</code> backends already write the same files to the data-plane <code>browse/</code> prefix and do not use Makers.</p>
</div>
